[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiperf"
version = "0.1.0"
description = "AI Inference Performance Benchmarking & Optimization Toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AIPerf Developer" }
]
keywords = [
    "deep-learning",
    "inference",
    "benchmarking",
    "performance-engineering",
    "computer-architecture",
    "pytorch"
]
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.40.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
analysis = [
    "duckdb>=0.10.0",
    "pandas>=2.2.0",
]

[project.scripts]
aiperf = "aiperf.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

